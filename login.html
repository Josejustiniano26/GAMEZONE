<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEZONE - Iniciar sesión</title>

<style>

:root{
    --fondo:#0F172A;
    --navbar:#111827;
    --tarjeta:#1E293B;
    --texto:#F8FAFC;
    --secundario:#94A3B8;

    --violeta:#7C3AED;
    --cyan:#06B6D4;
    --rosa:#EC4899;

    --borde:#334155;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

    background:var(--fondo);

    color:var(--texto);
}

/* =========================
   NAVBAR
========================= */

nav{
    height:75px;

    background:var(--navbar);

    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    padding:0 7%;
}

.logo{
    font-size:25px;

    font-weight:900;

    color:var(--texto);

    justify-self:start;
}

.logo span{
    color:var(--violeta);
}

.menu{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.menu a{
    position:relative;

    text-decoration:none;

    color:#CBD5E1;

    font-size:15px;

    font-weight:700;

    padding:12px 18px;

    transition:.2s;
}

.menu a:hover{
    color:var(--cyan);
}

.cuenta{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:12px;
}

.cuenta a{
    text-decoration:none;

    font-size:14px;

    font-weight:700;
}

.login{
    color:var(--violeta);

    padding:11px 16px;

    position:relative;
}

.login::after{
    content:"";

    position:absolute;

    left:16px;
    right:16px;

    bottom:3px;

    height:3px;

    background:var(--violeta);

    border-radius:5px;
}

.login:hover{
    color:var(--cyan);
}

.login:hover::after{
    background:var(--cyan);
}

.registro{
    background:var(--violeta);

    color:white;

    padding:10px 17px;

    border-radius:8px;

    transition:.2s;
}

.registro:hover{
    background:var(--rosa);
}

/* =========================
   CONTENEDOR
========================= */

.contenedor{
    min-height:calc(100vh - 75px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;
}

/* =========================
   LOGIN
========================= */

.login-box{
    width:100%;

    max-width:430px;

    background:var(--tarjeta);

    padding:40px;

    border-radius:20px;

    border:1px solid var(--borde);

    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.login-box h1{
    font-size:32px;

    margin-bottom:10px;

    color:var(--texto);
}

.login-box p{
    color:var(--secundario);

    margin-bottom:30px;

    line-height:1.5;
}

/* =========================
   FORMULARIO
========================= */

label{
    display:block;

    font-weight:bold;

    margin-bottom:8px;

    color:var(--texto);
}

input{
    width:100%;

    padding:14px;

    border:2px solid var(--borde);

    border-radius:10px;

    margin-bottom:20px;

    font-size:15px;

    outline:none;

    background:#0F172A;

    color:var(--texto);

    transition:.2s;
}

input::placeholder{
    color:#64748B;
}

input:focus{
    border-color:var(--violeta);

    box-shadow:0 0 0 2px rgba(124,58,237,.15);
}

/* =========================
   BOTÓN
========================= */

button{
    width:100%;

    border:0;

    padding:14px;

    background:var(--violeta);

    color:white;

    font-size:16px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    background:var(--rosa);
}

/* =========================
   REGISTRO
========================= */

.registro-texto{
    text-align:center;

    margin-top:20px;

    color:var(--secundario);
}

.registro-texto a{
    color:var(--cyan);

    text-decoration:none;

    font-weight:bold;
}

.registro-texto a:hover{
    color:var(--rosa);
}

/* =========================
   VOLVER
========================= */

.volver{
    display:block;

    text-align:center;

    margin-top:20px;

    color:var(--secundario);

    text-decoration:none;

    font-size:14px;

    transition:.2s;
}

.volver:hover{
    color:var(--cyan);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    nav{
        grid-template-columns:1fr 1fr;

        height:auto;

        padding:20px;

        gap:15px;
    }

    .menu{
        order:3;

        grid-column:1 / 3;

        flex-wrap:wrap;
    }

    .cuenta{
        justify-self:end;
    }

}

@media(max-width:600px){

    nav{
        grid-template-columns:1fr;
    }

    .logo,
    .cuenta{
        justify-self:center;
    }

    .menu{
        grid-column:auto;
    }

    .login-box{
        padding:30px 25px;
    }

}

</style>

</head>

<body>

<nav>

    <div class="logo">
        GAME<span>ZONE</span>
    </div>

    <div class="menu">

        <a href="index.html">
            Inicio
        </a>

        <a href="juegos.html">
            Juegos
        </a>

        <a href="generos.html">
            Géneros
        </a>

        <a href="noticias.html">
            Noticias
        </a>

    </div>

    <div class="cuenta">

        <a
            href="login.html"
            class="login">
            Iniciar sesión
        </a>

        <a
            href="#"
            class="registro">
            Registrarse
        </a>

    </div>

</nav>

<div class="contenedor">

    <div class="login-box">

        <h1>
            Iniciar sesión
        </h1>

        <p>
            Ingresa tus datos para continuar en GAMEZONE.
        </p>

        <form>

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="correo@ejemplo.com">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Contraseña">

            <button type="button">
                Iniciar sesión
            </button>

        </form>

        <div class="registro-texto">

            ¿No tienes una cuenta?

            <a href="#">
                Registrarse
            </a>

        </div>

        <a
            href="index.html"
            class="volver">
            Volver al inicio
        </a>

    </div>

</div>

</body>
</html>
