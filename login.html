<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE - Iniciar sesión</title>

    <style>
        :root{
            --fondo:#F0EEF7;
            --navbar:#D9D3EA;
            --tarjeta:#FAF8FF;
            --texto:#191625;
            --secundario:#625B72;
            --violeta:#7057E8;
            --rosa:#E9578F;
            --naranja:#F4A340;
            --azul:#4F8FE8;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,sans-serif;
            background:var(--fondo);
            color:var(--texto);
        }

        nav{
            height:75px;
            background:var(--navbar);
            display:grid;
            grid-template-columns:1fr auto 1fr;
            align-items:center;
            padding:0 7%;
        }

        .logo{
            font-size:25px;
            font-weight:900;
            color:var(--violeta);
            justify-self:start;
        }

        .menu{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .menu a{
            position:relative;
            text-decoration:none;
            color:var(--secundario);
            font-size:15px;
            font-weight:700;
            padding:12px 18px;
        }

        .menu a:hover{
            color:var(--violeta);
        }

        .cuenta{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:12px;
        }

        .login{
            color:var(--violeta);
            text-decoration:none;
            font-size:15px;
            font-weight:700;
            padding:11px 16px;
            position:relative;
        }

        .login::after{
            content:"";
            position:absolute;
            left:16px;
            right:16px;
            bottom:3px;
            height:3px;
            background:var(--violeta);
            border-radius:5px;
        }

        .registro{
            background:var(--violeta);
            color:white;
            text-decoration:none;
            font-size:15px;
            font-weight:700;
            padding:12px 18px;
            border-radius:10px;
        }

        .contenedor{
            min-height:calc(100vh - 75px);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .login-box{
            width:100%;
            max-width:430px;
            background:var(--tarjeta);
            padding:40px;
            border-radius:22px;
            box-shadow:0 10px 30px rgba(50,40,80,.1);
        }

        .login-box h1{
            font-size:32px;
            margin-bottom:10px;
        }

        .login-box p{
            color:var(--secundario);
            margin-bottom:30px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:14px;
            border:2px solid #DDD7E8;
            border-radius:10px;
            margin-bottom:20px;
            font-size:15px;
            outline:none;
        }

        input:focus{
            border-color:var(--violeta);
        }

        button{
            width:100%;
            border:0;
            padding:14px;
            background:var(--violeta);
            color:white;
            font-size:16px;
            font-weight:bold;
            border-radius:10px;
            cursor:pointer;
        }

        .registro-texto{
            text-align:center;
            margin-top:20px;
            color:var(--secundario);
        }

        .registro-texto a{
            color:var(--violeta);
            text-decoration:none;
            font-weight:bold;
        }

        .volver{
            display:block;
            text-align:center;
            margin-top:20px;
            color:var(--secundario);
            text-decoration:none;
            font-size:14px;
        }

        @media(max-width:900px){
            nav{
                grid-template-columns:1fr 1fr;
                height:auto;
                padding:20px;
                gap:15px;
            }

            .menu{
                order:3;
                grid-column:1 / 3;
                flex-wrap:wrap;
            }

            .cuenta{
                justify-self:end;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">GAMEZONE</div>

        <div class="menu">
            <a href="index.html">Inicio</a>
            <a href="juegos.html">Juegos</a>
            <a href="generos.html">Géneros</a>
            <a href="noticias.html">Noticias</a>
        </div>

        <div class="cuenta">
            <a href="login.html" class="login">Iniciar sesión</a>
            <a href="#" class="registro">Registrarse</a>
        </div>
    </nav>

    <div class="contenedor">

        <div class="login-box">

            <h1>Iniciar sesión</h1>

            <p>
                Ingresa tus datos para continuar en GAMEZONE.
            </p>

            <form>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña">

                <button type="button">Iniciar sesión</button>
            </form>

            <div class="registro-texto">
                ¿No tienes una cuenta?
                <a href="#">Registrarse</a>
            </div>

            <a href="index.html" class="volver">Volver al inicio</a>

        </div>

    </div>

</body>
</html>
